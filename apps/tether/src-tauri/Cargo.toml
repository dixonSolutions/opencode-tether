[package]
name = "opencode-tether"
version = "0.1.0"
description = "Unofficial native remote interface for opencode"
authors = ["opencode-tether contributors"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "opencode_tether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
