[package]
name = "opencode-tether"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Server-side host and CLI for opencode-tether, an unofficial remote interface for opencode"
license = "MIT"
repository = "https://github.com/dixonSolutions/opencode-tether"
homepage = "https://github.com/dixonSolutions/opencode-tether"
keywords = ["opencode", "remote", "proxy", "tui", "ai"]
categories = ["command-line-utilities", "web-programming"]

[features]
default = ["embed-web"]
embed-web = []

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
mime_guess = "2"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rpassword = "7"
rust-embed = { version = "8", features = ["include-exclude"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
