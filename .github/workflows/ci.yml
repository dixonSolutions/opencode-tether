name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tether/package-lock.json
      - run: npm ci
        working-directory: apps/tether
      - run: npm run check
        working-directory: apps/tether
      - run: npm run build
        working-directory: apps/tether

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tether/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/tether
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --all-targets
        working-directory: server
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: server
