name: opencode-tether
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: opencode-tether contributors <noreply@opencode-tether.invalid>
description: |
  Unofficial host and CLI for opencode-tether.
  Serves the opencode-tether web app, launches and proxies an opencode server,
  and exposes the opencode API behind one login.
vendor: opencode-tether
homepage: https://github.com/dixonSolutions/opencode-tether
license: MIT
provides:
  - opencode-tether
contents:
  - src: ${BINARY}
    dst: /usr/bin/opencode-tether
    file_info:
      mode: 0755
  - src: packaging/systemd/opencode-tether.service
    dst: /usr/lib/systemd/user/opencode-tether.service
    file_info:
      mode: 0644
  - src: packaging/config.example.toml
    dst: /usr/share/doc/opencode-tether/config.example.toml
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/opencode-tether/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/opencode-tether/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
